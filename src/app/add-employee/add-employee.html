
<div class="container mt-4">

  <h2>Ajouter un employé :</h2>

  <form #employeeForm="ngForm"
        (ngSubmit)="addEmployee()">



    <!-- Nom complet -->
    <div class="col-sm-6 mb-3">
      <label for="nomComplet" class="form-label">
        Nom complet
      </label>

      <input
        type="text"
        id="nomComplet"
        name="nomComplet"
        [(ngModel)]="newEmployee.nomComplet"
        class="form-control">
    </div>

    <!-- Salaire -->
    <div class="col-sm-4 mb-3">
      <label for="salaire" class="form-label">
        Salaire
      </label>

      <input
        type="number"
        id="salaire"
        name="salaire"
        [(ngModel)]="newEmployee.salaire"
        class="form-control">
    </div>

    <!-- Date d'embauche -->
    <div class="col-sm-6 mb-3">
      <label for="dateEmbauche" class="form-label">
        Date d'embauche
      </label>

      <input
        type="date"
        id="dateEmbauche"
        name="dateEmbauche"
        [(ngModel)]="dateEmbaucheInput"
        (ngModelChange)="onDateChange($event)"
        class="form-control">
    </div>
        <!-- Département -->
    <div class="col-sm-6 mb-3">
      <label for="idDepartement" class="form-label">Département</label>

      <select
        id="idDepartement"
        name="idDepartement"
        class="form-select"
        [(ngModel)]="newIdDep"
        required>
        <option [ngValue]="null" disabled>-- Choisir un département --</option>
        @for (dep of departements; track dep.idDepartement) {
          <option [ngValue]="dep.idDepartement">{{ dep.nomDepartement }}</option>
        }
      </select>
    </div>

    <!-- Bouton -->
    <div class="mt-2">
     <button type="submit" class="btn btn-success" [disabled]="employeeForm.invalid"> Ajouter</button>
    </div>

  </form>
</div>
